<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#5B4BFF">
<link rel="canonical" href="https://scholary.kz/quiz/">
  <title>Квиз — рассчитай вероятность | Scholary</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css?v=66">
  <script src="/js/config.js?v=66"></script>
<script src="/js/telemetry.js?v=66"></script>

  <!-- Виджет TipTop Pay: грузить только с widget.tiptoppay.kz (требование провайдера) -->

</head>
<body>
<h1 class="sr-only">Расчёт вероятности поступления за рубеж со стипендией — Scholary</h1>

<header class="site-header">
  <a class="logo" href="/">Scholary</a>
  <div id="topStatus" style="font-size:13px; font-weight:700; color:var(--muted)"></div>
</header>

<div class="quiz-shell">
  <div class="quiz-top" id="quizTop">
    <div class="quiz-meta">
      <span id="metaLeft">Вопрос 1 из 7</span>
      <span class="step-count" id="metaRight">~2 минуты</span>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill" style="width:6%"></div></div>
  </div>
  <div id="screen" style="display:flex; flex-direction:column; flex-grow:1"></div>
</div>

<script>
"use strict";
document.addEventListener("DOMContentLoaded", function () {

const C = window.SCHOLARY_CONFIG;
const PH = window.ScholaryPhone;
const $ = (id) => document.getElementById(id);
const screen = $("screen");
const answers = {};           // ответы фазы 1
const phase2 = {};            // ответы фазы 2
let stepIndex = 0;

/* =====================================================================
   ФАЗА 1 — восемь экранов. groups: подгруппы вопросов на одном экране.
   ===================================================================== */
const STEPS = [
  { id: "level", q: "Куда поступаем?", why: "От уровня зависят и программы, и веса модели",
    groups: [
      { key: "level", label: null, type: "single", options: [
        { v: "bachelor", t: "После школы — на бакалавриат" },
        { v: "master", t: "После бакалавриата — на магистратуру" },
        { v: "phd", t: "На PhD / докторантуру" } ] },
      { key: "year", label: "Год поступления", type: "chips-single", options: [
        { v: "2027", t: "2027" }, { v: "2028", t: "2028" }, { v: "later", t: "Позже / не решил" } ] }
    ] },
  { id: "academics", q: "Как у тебя с оценками?", why: "Академика — одна из шести осей расчёта. Честный ответ = честный прогноз",
    groups: [
      // --- ветка БАКАЛАВРИАТ (после школы) ---
      { key: "gpa_band", label: "Средний балл аттестата", type: "single", showIf: (a) => a.level !== "master" && a.level !== "phd", options: [
        { v: "5.0-4.5", t: "5.0 – 4.5", s: "почти отличник" },
        { v: "4.4-4.0", t: "4.4 – 4.0" },
        { v: "3.9-3.5", t: "3.9 – 3.5" },
        { v: "<3.5", t: "Ниже 3.5", s: "это не приговор — есть программы и для такого профиля" } ] },
      { key: "school_type", label: "Где учишься", type: "chips-single", showIf: (a) => a.level !== "master" && a.level !== "phd", options: [
        { v: "nis", t: "НИШ" }, { v: "rfmsh", t: "РФМШ / БИЛ" }, { v: "lyceum", t: "Лицей / гимназия" },
        { v: "regular", t: "Школа" }, { v: "college", t: "Колледж" } ] },
      // --- ветка PhD: своя шкала + тема исследования ---
      { key: "gpa_phd", label: "GPA магистратуры (шкала 4.0)", type: "single", showIf: (a) => a.level === "phd", options: [
        { v: "3.67+", t: "3.67 и выше" },
        { v: "3.33-3.66", t: "3.33 – 3.66" },
        { v: "3.0-3.32", t: "3.0 – 3.32" },
        { v: "<3.0", t: "Ниже 3.0" },
        { v: "unknown", t: "Не знаю свой GPA" } ] },
      { key: "phd_topic", label: "Тема исследования", type: "chips-single", showIf: (a) => a.level === "phd", options: [
        { v: "defined", t: "Тема определена" }, { v: "rough", t: "Есть направление" }, { v: "none", t: "Пока нет" } ] },
      // --- ветка МАГИСТРАТУРА ---
      { key: "gpa_uni", label: "GPA бакалавриата (шкала 4.0)", type: "single", showIf: (a) => a.level === "master", options: [
        { v: "3.67+", t: "3.67 и выше", s: "зона красного диплома" },
        { v: "3.33-3.66", t: "3.33 – 3.66" },
        { v: "3.0-3.32", t: "3.0 – 3.32" },
        { v: "<3.0", t: "Ниже 3.0", s: "есть программы, где важнее опыт и мотивация" },
        { v: "unknown", t: "Не знаю свой GPA" } ] },
      { key: "uni_type", label: "Где учишься / учился", type: "chips-single", showIf: (a) => a.level === "master" || a.level === "phd", options: [
        { v: "nu", t: "Назарбаев Университет" }, { v: "top_kz", t: "Топ-вуз РК (КБТУ, КИМЭП, ЕНУ, КазНУ…)" },
        { v: "regional", t: "Другой вуз РК" }, { v: "foreign", t: "Зарубежный вуз" } ] }
    ] },
  { id: "language", q: "Что с английским?", why: "Язык — главный фильтр реальности. Многие программы принимают и без сертификата",
    groups: [
      { key: "lang_status", label: null, type: "single", options: [
        { v: "have", t: "Есть IELTS / TOEFL", s: "укажешь балл ниже" },
        { v: "soon", t: "Сдаю в ближайшие полгода" },
        { v: "none", t: "Сертификата нет и пока не планирую" } ] },
      { key: "ielts_band", label: "Балл (или ожидаемый)", type: "chips-single", showIf: (a) => a.lang_status === "have" || a.lang_status === "soon", options: [
        { v: "7+", t: "7.0+" }, { v: "6.5", t: "6.5" }, { v: "6.0", t: "6.0" }, { v: "5.5", t: "5.5" }, { v: "<5.5", t: "ниже 5.5" }, { v: "unknown", t: "не знаю" } ] },
      { key: "sat", label: "SAT — для США и части топ-вузов", type: "chips-single", showIf: (a) => a.level !== "master" && a.level !== "phd", options: [
        { v: "1400+", t: "Сдан, 1400+" }, { v: "1200-1399", t: "Сдан, 1200–1399" }, { v: "<1200", t: "Сдан, ниже 1200" },
        { v: "plan", t: "Планирую сдавать" }, { v: "no", t: "Не сдаю" } ] }
    ] },
  { id: "field", q: "Какие направления тянут?", why: "Можно выбрать до трёх — портфель соберём по всем",
    groups: [ { key: "field", label: null, type: "multi", max: 3, options: [
      { v: "it", t: "IT и Computer Science" },
      { v: "eng", t: "Инженерия и технологии" },
      { v: "med", t: "Медицина и здоровье" },
      { v: "bus", t: "Бизнес и экономика" },
      { v: "sci", t: "Естественные науки" },
      { v: "hum", t: "Гуманитарные и социальные" },
      { v: "art", t: "Искусство и дизайн" },
      { v: "law", t: "Право" } ] } ] },
  { id: "achievements", q: "Что уже есть в копилке?", why: "Выбери всё, что подходит — достижения добавляют баллы стипендиям",
    groups: [ { key: "achievements", label: null, type: "multi", options: [
      { v: "intl_olymp", t: "Международные олимпиады" },
      { v: "rep_olymp", t: "Республиканские олимпиады" },
      { v: "city_olymp", t: "Областные / городские олимпиады", showIf: (a) => a.level !== "master" && a.level !== "phd" },
      { v: "publications", t: "Научные публикации / конференции", showIf: (a) => a.level === "master" || a.level === "phd" },
      { v: "work_exp", t: "Опыт работы по специальности", showIf: (a) => a.level === "master" || a.level === "phd" },
      { v: "project", t: "Проекты, стартапы, исследования" },
      { v: "volunteer", t: "Волонтёрство" },
      { v: "sport_art", t: "Спорт / творчество на уровне наград" },
      { v: "none", t: "Пока ничего из этого", exclusive: true } ] } ] },
  { id: "budget", q: "Сколько семья готова вкладывать в год?", why: "Считаем только реальные варианты: есть программы с обучением за 0 ₸",
    groups: [ { key: "budget", label: null, type: "single", options: [
      { v: "0", t: "0 ₸ — только полная стипендия" },
      { v: "<1m", t: "До 1 млн ₸" },
      { v: "1-3m", t: "1 – 3 млн ₸" },
      { v: "3m+", t: "Больше 3 млн ₸" } ] } ] },
  { id: "priority", q: "Что для тебя важнее всего?", why: "От ответа зависит, как соберём твой портфель программ",
    groups: [
      { key: "priority", label: null, type: "single", options: [
        { v: "scholarship", t: "Стипендия и минимум расходов" },
        { v: "country", t: "Конкретная страна", s: "уточним какая" },
        { v: "university", t: "Сильный университет" },
        { v: "major", t: "Конкретная специальность" } ] },
      { key: "target_countries", label: "Какие страны? (до трёх)", type: "chips-multi", max: 3, showIf: (a) => a.priority === "country", options: [
        { v: "hu", t: "Венгрия" }, { v: "de", t: "Германия" }, { v: "it", t: "Италия" }, { v: "cz", t: "Чехия" },
        { v: "tr", t: "Турция" }, { v: "cn", t: "Китай" }, { v: "kr", t: "Корея" }, { v: "jp", t: "Япония" },
        { v: "pl", t: "Польша" }, { v: "us", t: "США" }, { v: "uk", t: "Британия" }, { v: "ca", t: "Канада" },
        { v: "fr", t: "Франция" }, { v: "nl", t: "Нидерланды" }, { v: "ae", t: "ОАЭ" }, { v: "other", t: "Другая" } ] },
      { key: "target_university", label: "Есть конкретный вуз на примете? (необязательно)", type: "input", placeholder: "Например: TU Munich", optional: true, showIf: (a) => a.priority === "university" },
      { key: "target_major", label: "Какая специальность? (необязательно)", type: "input", placeholder: "Например: Data Science", optional: true, showIf: (a) => a.priority === "major" }
    ] },
  { id: "contact", q: "Куда прислать результат?", why: null, contact: true }
];

/* ---------- Рендер ---------- */
function h(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function setProgress(i, total, done) {
  // последний шаг — контакты, а не вопрос: на сайте обещаем «7 вопросов»
  var qTotal = total - 1;
  $("metaLeft").textContent = done ? "Готово"
    : (i >= qTotal ? "Последний шаг" : "Вопрос " + (i + 1) + " из " + qTotal);
  $("metaRight").textContent = done ? "" : ("~" + Math.max(1, Math.round((total - i) * 0.25)) + " мин осталось");
  const f = $("progressFill");
  f.style.width = (done ? 100 : Math.round(((i + 1) / (total + 1)) * 100)) + "%";
  f.classList.toggle("done", !!done);
}

function stepComplete(st) {
  if (st.contact) return true;
  return st.groups.every(g => {
    if (g.showIf && !g.showIf(answers)) return true;
    if (g.optional || g.type === "input") return true;
    const v = answers[g.key];
    if (g.type === "multi" || g.type === "chips-multi") return Array.isArray(v) && v.length > 0;
    return !!v;
  });
}

/* Единственное место, которое пишет прогресс в localStorage.
   Почту храним здесь же: человек мог ввести её на экране оплаты, уйти в Kaspi
   и вернуться — заставлять набирать заново нельзя, это прямая потеря оплаты.
   progressExtra «липкий»: флаг пейволла и превью-расчёт нельзя терять при
   любом следующем persist(), иначе после возврата человек падает на первый
   вопрос анкеты вместо экрана оплаты. */
var progressExtra = {};
function persist(extra) {
  try {
    if (extra) for (var k in extra) progressExtra[k] = extra[k];
    var o = { answers: answers, step: stepIndex, email: phase2.email || "" };
    for (var j in progressExtra) o[j] = progressExtra[j];
    localStorage.setItem("scholary_quiz_v1", JSON.stringify(o));
  } catch (e) {}
}

function renderStep() {
  const st = STEPS[stepIndex];
  persist();
  setProgress(stepIndex, STEPS.length, false);
  track("quiz_step", { step: stepIndex + 1, id: st.id });
  if (st.contact) return renderContact();

  screen.innerHTML = "";
  screen.appendChild(h('<div class="quiz-q">' + st.q + "</div>"));
  if (st.why) screen.appendChild(h('<div class="quiz-why">' + st.why + "</div>"));
  const wrap = h('<div style="display:flex; flex-direction:column; gap:18px"></div>');
  screen.appendChild(wrap);

  st.groups.forEach(g => {
    if (g.showIf && !g.showIf(answers)) return;
    const gEl = h('<div style="display:flex; flex-direction:column; gap:9px"></div>');
    if (g.label) gEl.appendChild(h('<div style="font-size:13px; font-weight:700; color:var(--muted)">' + g.label + "</div>"));

    if (g.type === "input") { // свободный ввод (необязательные уточнения)
      const inp = h('<input class="input" placeholder="' + (g.placeholder || "") + '">');
      inp.value = answers[g.key] || "";
      inp.addEventListener("change", () => { answers[g.key] = inp.value.trim(); persist(); saveLead(flatAnswers()); });
      gEl.appendChild(inp);
      wrap.appendChild(gEl);
      return;
    }

    const isMulti = g.type === "multi" || g.type === "chips-multi";
    const box = h(g.type.startsWith("chips") ? '<div class="chips"></div>' : '<div class="opts"></div>');

    g.options.filter(o => !o.showIf || o.showIf(answers)).forEach(o => {
      const isChip = g.type.startsWith("chips");
      const el = h(isChip
        ? '<button type="button" class="chip">' + o.t + "</button>"
        : '<button type="button" class="opt"><span>' + o.t + (o.s ? '<span class="sub">' + o.s + "</span>" : "") + '</span><span class="opt-check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>');

      el.addEventListener("click", () => {
        if (isMulti) {
          let arr = answers[g.key] || [];
          if (o.exclusive) { arr = arr.includes(o.v) ? [] : [o.v]; }
          else {
            arr = arr.filter(x => x !== "none");
            if (arr.includes(o.v)) arr = arr.filter(x => x !== o.v);
            else if (!g.max || arr.length < g.max) arr = arr.concat(o.v); // мягкий лимит выбора
          }
          answers[g.key] = arr;
        } else {
          answers[g.key] = o.v;
        }
        saveLead(flatAnswers());
        renderStep(); // перерисовка отражает выбор и showIf-группы
      });

      const val = answers[g.key];
      const selected = isMulti ? (val || []).includes(o.v) : val === o.v;
      if (selected) el.classList.add("selected");
      box.appendChild(el);
    });
    gEl.appendChild(box);
    wrap.appendChild(gEl);
  });

  const nav = h('<div class="quiz-nav"></div>');
  if (stepIndex > 0) {
    const back = h('<button type="button" class="btn btn-ghost" style="width:auto">← Назад</button>');
    back.addEventListener("click", prev);
    nav.appendChild(back);
  }
  const fwd = h('<button type="button" class="btn btn-primary">Далее</button>');
  fwd.disabled = !stepComplete(st);
  fwd.addEventListener("click", next);
  nav.appendChild(fwd);
  screen.appendChild(nav);
}

function flatAnswers() {
  const out = {};
  Object.keys(answers).forEach(k => { out[k] = Array.isArray(answers[k]) ? answers[k].join(",") : answers[k]; });
  return out;
}
/* Снимок ПОЛНОГО расчёта движка. Уезжает на лида (leads.result):
   из него сервер собирает отчёт сразу после оплаты — человек получает
   ссылку через минуту, а не когда у основателя дойдут руки. */
function engineSnapshot() {
  try {
    if (!window.ScholaryEngine) return {};
    const r = ScholaryEngine.evaluate(answers);
    r.answers = Object.assign({}, answers);
    r.generatedAt = new Date().toISOString();
    return { result: r };
  } catch (e) { return {}; }
}
function next() { if (stepIndex < STEPS.length - 1) { stepIndex++; renderStep(); } }
function prev() { if (stepIndex > 0) { stepIndex--; progressExtra.paywall = false; renderStep(); } }

/* ---------- Экран 8: контакты ---------- */
function renderContact() {
  screen.innerHTML = "";
  screen.appendChild(h('<div class="quiz-q">Куда прислать результат?</div>'));
  screen.appendChild(h('<div class="quiz-why">Расчёт уже почти готов. Пришлём вердикт и превью на WhatsApp</div>'));
  const form = h(
    '<div style="display:flex; flex-direction:column; gap:14px">' +
      '<div class="field"><label for="fName">Имя</label><input id="fName" class="input" autocomplete="name" placeholder="Аида" value="' + esc(answers.name || "") + '"></div>' +
      '<div class="field"><label for="fWa">Номер WhatsApp</label><input id="fWa" class="input" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 7__ ___ __ __" maxlength="20" value="' + esc(PH.format(answers.whatsapp || "")) + '">' +
        '<div id="fWaHint" class="field-hint">Можно начать с 8 или +7 — приведём к одному формату. На этот номер придёт ссылка на отчёт.</div></div>' +
      '<div class="fineprint" style="text-align:left">Нажимая «Показать результат», ты соглашаешься с <a href="/oferta/" target="_blank">офертой</a> и <a href="/privacy/" target="_blank">политикой конфиденциальности</a>. Не звоним без предупреждения — сначала пишем в WhatsApp.</div>' +
    "</div>");
  screen.appendChild(form);
  PH.attach($("fWa"));
  const setErr = (id, hintId, msg) => {
    const el = $(id); el.classList.toggle("input-error", !!msg);
    const hint = $(hintId); if (hint) { hint.classList.toggle("is-error", !!msg); if (msg) hint.textContent = msg; }
    if (msg) { el.focus(); try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) {} }
  };
  $("fName").addEventListener("input", () => $("fName").classList.remove("input-error"));
  $("fWa").addEventListener("input", () => { if ($("fWa").classList.contains("input-error") && PH.valid($("fWa").value)) setErr("fWa", "fWaHint", ""); });
  const nav = h('<div class="quiz-nav"></div>');
  const back = h('<button type="button" class="btn btn-ghost" style="width:auto">← Назад</button>');
  back.addEventListener("click", prev);
  const go = h('<button type="button" class="btn btn-primary">Показать результат</button>');
  go.addEventListener("click", () => {
    const name = $("fName").value.trim().slice(0, 60);
    const wa = PH.normalize($("fWa").value);
    if (name.length < 2) { setErr("fName", null, "Как к тебе обращаться?"); return; }
    if (!PH.valid($("fWa").value)) {
      setErr("fWa", "fWaHint", "Проверь номер: нужно 10 цифр после +7, например +7 775 383 18 36. Сюда придёт ссылка на отчёт.");
      track("quiz_phone_invalid", { len: PH.digits($("fWa").value).length });
      return;
    }
    $("fWa").value = PH.format(wa);
    answers.name = name; answers.whatsapp = wa;
    saveLead(Object.assign(flatAnswers(), { name: name, whatsapp: wa }, engineSnapshot()));
    track("quiz_done");
    if (window.scholaryTtIdentify) window.scholaryTtIdentify({ phone: wa });
    renderPaywall();
  });
  nav.appendChild(back); nav.appendChild(go);
  screen.appendChild(nav);
}

/* =====================================================================
   ПРЕВЬЮ-РАСЧЁТ для пейволла — через ScholaryEngine (js/report-engine.js).
   Тот же движок использует бэкенд для полного отчёта: одна логика, два места.
   ===================================================================== */
function pBlend(vals) {
  // P(хотя бы один) c поправкой на корреляцию исходов — формула движка
  if (!vals.length) return 0.05;
  const ps = vals.slice().sort((a, b) => b - a);
  let pNone = 1;
  ps.slice(0, 6).forEach(p => { pNone *= (1 - Math.min(p, 0.85)); });
  const indep = 1 - pNone;
  return Math.min(0.95, Math.max(0.05, ps[0] + (indep - ps[0]) * 0.35));
}
function previewCalc() {
  if (window.ScholaryEngine) try {
    const r = ScholaryEngine.evaluate(answers);
    /* Число на пейволле обязано совпасть с числом в купленном отчёте —
       поэтому берём готовый r.pAtLeastOne, а не считаем заново. */
    const pAdm = Math.round(r.pAtLeastOne * 100);
    /* стипендия: лучшая программа на страну, страны квази-независимы */
    const byCc = {};
    r.portfolio.forEach(p => { if (p.p.sch != null) { const k = p.cc || p.country; if (!byCc[k] || p.p.sch > byCc[k]) byCc[k] = p.p.sch; } });
    const pSch = Math.min(Math.round(pBlend(Object.values(byCc)) * 100), pAdm);
    const pDl = r.pAtLeastOneAtDeadline != null ? Math.round(r.pAtLeastOneAtDeadline * 100) : null;
    return { programs: r.programsCount, country: r.topCountry, verdict: r.verdict, pAdm: pAdm, pSch: pSch,
             pDl: pDl, conf: r.confidence || null };
  } catch (e) { try { track("engine_error", { where: "preview" }); } catch (_) {} }
  return previewCalcFallback();
}
function previewCalcFallback() {
  let programs = 8, country = "Венгрия";
  const isGrad = answers.level === "master" || answers.level === "phd";
  const gradGpa = answers.level === "phd" ? answers.gpa_phd : answers.gpa_uni;
  const gpaScore = isGrad
    ? ({ "3.67+": 3, "3.33-3.66": 2, "3.0-3.32": 1, "<3.0": 0, "unknown": 1 }[gradGpa] || 0)
    : ({ "5.0-4.5": 3, "4.4-4.0": 2, "3.9-3.5": 1, "<3.5": 0 }[answers.gpa_band] || 0);
  const langScore = answers.lang_status === "have" ? 2 : answers.lang_status === "soon" ? 1 : 0;
  const fields = answers.field || [];
  programs = 6 + gpaScore + langScore + ((answers.achievements || []).filter(a => a !== "none").length ? 1 : 0) + (fields.length > 1 ? 1 : 0);
  const COUNTRY_NAMES = { hu: "Венгрия", de: "Германия", it: "Италия", cz: "Чехия", tr: "Турция", cn: "Китай", kr: "Корея", jp: "Япония", pl: "Польша", us: "США", uk: "Британия", ca: "Канада", fr: "Франция", nl: "Нидерланды", ae: "ОАЭ" };
  const tc = (answers.target_countries || [])[0];
  if (answers.priority === "country" && COUNTRY_NAMES[tc]) country = COUNTRY_NAMES[tc];
  else if (answers.budget === "3m+") country = "Германия";
  else if (answers.priority === "scholarship") country = "Венгрия";
  else if (fields.includes("med")) country = "Италия";
  else if (answers.budget === "0") country = "Венгрия";
  else country = "Италия";
  const verdict = (gpaScore + langScore >= 3)
    ? { t: "Поступление со стипендией — реалистичная цель", s: "Полный отчёт покажет, какие программы дают лучший шанс и что усилить." }
    : (gpaScore + langScore >= 1)
      ? { t: "Реалистично — при одном условии", s: "Есть слабое место, которое можно закрыть. В отчёте видно, что именно это меняет." }
      : { t: "Прямо сейчас шансы низкие — но есть план", s: "В отчёте — программы, куда путь открыт, и что даст наибольший прирост." };
  return { programs: Math.min(programs, 12), country, verdict };
}

  "gmail.com":   ["gmial.com","gmai.com","gmail.co","gmail.cm","gmail.con","gmail.ru","gmaill.com","gmail.om","gnail.com","gamil.com","gmail.comm","g-mail.com","googlemail.co"],
  "mail.ru":     ["mai.ru","mail.ry","mail.tu","meil.ru","mail.ru.com","mial.ru","mail.rru"],

};
function emailFix(v) {
  const s = String(v || "").trim();
  const at = s.lastIndexOf("@");
  if (at < 1 || at === s.length - 1) return null;
  const local = s.slice(0, at), dom = s.slice(at + 1).toLowerCase();
  for (const good in EMAIL_DOMAINS) {
    if (dom === good) return null;
    if (EMAIL_DOMAINS[good].indexOf(dom) !== -1) return local + "@" + good;
  }
  return null;
}

function renderPhase2() {
  const box = $("phase2box");
  box.innerHTML = "";
  PHASE2.forEach(f => {
    const fEl = h('<div class="field"></div>');
    fEl.appendChild(h("<label>" + f.label + "</label>"));
    if (f.type === "input") {
      const inp = h('<input class="input"' + (f.mode ? ' inputmode="' + f.mode + '"' : "") + ">");
      inp.value = phase2[f.key] || "";
      inp.addEventListener("change", () => { phase2[f.key] = inp.value.trim(); saveP2(f.key); });
      fEl.appendChild(inp);
    } else {
      const chips = h('<div class="chips"></div>');
      f.options.forEach(o => {
        const c = h('<button type="button" class="chip">' + o + "</button>");
        const isMulti = f.type === "chips-multi";
        const val = phase2[f.key];
        if (isMulti ? (val || []).includes(o) : val === o) c.classList.add("selected");
        c.addEventListener("click", () => {
          if (isMulti) {
            let arr = phase2[f.key] || [];
            arr = arr.includes(o) ? arr.filter(x => x !== o) : arr.concat(o);
            phase2[f.key] = arr;
          } else phase2[f.key] = o;
          saveP2(f.key);
          renderPhase2();
        });
        chips.appendChild(c);
      });
      fEl.appendChild(chips);
    }
    box.appendChild(fEl);
  });
  const doneBtn = h('<button type="button" class="btn btn-primary">Готово — жду отчёт</button>');
  doneBtn.addEventListener("click", () => {
    track("phase2_done");
    doneBtn.replaceWith(h('<div class="notice" style="background:var(--green-soft); color:var(--green)">Принято! Отчёт учтёт все уточнения. Можно закрыть страницу — всё придёт на WhatsApp.</div>'));
  });
  box.appendChild(doneBtn);
}
function saveP2(key) {
  track("phase2_field", { field: key });
  const v = phase2[key];
  const o = {}; o["p2_" + key] = Array.isArray(v) ? v.join(",") : v;
  saveLead(o);
}

/* ---------- Утилиты ---------- */
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

// Восстановление прогресса: закрыл вкладку — продолжает с того же места
try {
  const saved = JSON.parse(localStorage.getItem("scholary_quiz_v1") || "null");
  if (saved && saved.answers && Object.keys(saved.answers).length) {
    Object.assign(answers, saved.answers);
    if (saved.email) phase2.email = saved.email;      // не заставляем набирать почту заново
    stepIndex = Math.min(saved.step || 0, STEPS.length - 1);
    track("quiz_resume", { step: stepIndex + 1 });
    if (saved.paywall && saved.answers.name) { track("quiz_start"); renderPaywall(); return; }
  }
} catch (e) {}

track("quiz_start");
renderStep();
});
