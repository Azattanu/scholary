<main class="narrow" style="padding-top:18px; padding-bottom:48px; display:flex; flex-direction:column; gap:14px" id="report">
  <div class="card" id="loading" style="text-align:center; color:var(--muted); font-weight:600">Загружаем твой отчёт…</div>
</main>

<script>
"use strict";
function renderRecovery(box, C) {
  box.innerHTML =
    '<div class="card" style="display:flex; flex-direction:column; gap:12px">' +
      '<div><strong style="font-size:17px">Не можем открыть этот отчёт</strong>' +
      '<p style="color:var(--muted); font-size:14px; margin:6px 0 0">Ссылка неполная или устарела — такое бывает, если письмо переслали или адрес скопировался не целиком. Отчёт при этом никуда не делся: он хранится за тобой и не сгорает.</p></div>' +
      '<div style="background:var(--bg); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px">' +
        '<div style="font-size:14px; font-weight:700">Уже оплачивал? Пришлём ссылку заново</div>' +
        '<div class="field"><label for="recContact">Номер WhatsApp или почта, которые ты указывал при покупке</label>' +
        '<input id="recContact" class="input" autocomplete="tel" placeholder="+7 701 234 56 78"></div>' +
        '<button type="button" class="btn btn-primary" id="recGo">Прислать ссылку заново</button>' +
        '<div id="recMsg" style="font-size:13px; font-weight:600; color:var(--muted)"></div>' +
      '</div>' +
      '<div style="font-size:13px; color:var(--muted); font-weight:600">Ещё не покупал отчёт? <a href="/quiz/">Пройди квиз</a> — расчёт бесплатный.<br>Нужен человек: <a href="https://wa.me/' + C.WHATSAPP_NUMBER + '" target="_blank" rel="noopener">написать в WhatsApp</a>.</div>' +
    '</div>';
  var input = document.getElementById("recContact");
  var btn = document.getElementById("recGo");
  var msg = document.getElementById("recMsg");
  btn.addEventListener("click", async function () {
    var v = (input.value || "").trim();
    if (v.length < 5) { msg.style.color = "var(--red, #D92D20)"; msg.textContent = "Впиши номер WhatsApp или почту."; return; }
    btn.disabled = true; btn.textContent = "Ищем…"; msg.style.color = "var(--muted)"; msg.textContent = "";
    try {
      var r = await fetch("/api/report-recover.php", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contact: v })
      });
      var j = await r.json().catch(function () { return {}; });
      if (r.status === 429 || j.why === "rate_limited") {
        msg.style.color = "var(--red, #D92D20)";
        msg.textContent = "Слишком много попыток. Напиши нам в WhatsApp — найдём отчёт вручную.";
      } else {
        /* Ответ намеренно одинаковый: сервер не подтверждает, есть ли такой
           клиент, иначе форму можно было бы использовать как проверялку базы. */
        msg.style.color = "var(--green)";
        msg.textContent = "Готово. Если на эти контакты был оплачен отчёт, ссылка уже отправлена в WhatsApp и на почту (проверь папку «Спам»).";
      }
    } catch (err) {
      msg.style.color = "var(--red, #D92D20)";
      msg.textContent = "Не получилось отправить. Напиши нам в WhatsApp — поможем сразу.";
    }
    btn.disabled = false; btn.textContent = "Прислать ссылку заново";
  });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") btn.click(); });
  if (window.track) track("report_not_found");
}

document.addEventListener("DOMContentLoaded", async function () {
  const C = window.SCHOLARY_CONFIG;
  const box = document.getElementById("report");
  const params = new URLSearchParams(location.search);
  const esc = s => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
  const pct = p => Math.round(p * 100);

  let payload = null; // {data, texts}
  try {
    if (params.get("demo") === "1") {
      // Демо-режим для проверки вёрстки без бэкенда: считаем образцовый профиль движком
      const demoAnswers = { level: "bachelor", year: "2027", gpa_band: "4.4-4.0", school_type: "lyceum", lang_status: "have", ielts_band: "6.0", sat: "plan", field: ["it"], achievements: ["rep_olymp", "project"], budget: "<1m", priority: "scholarship", name: "Аида" };
      payload = { data: ScholaryEngine.evaluate(demoAnswers), texts: null, demoName: "Аида" };
      payload.data.answers = demoAnswers;
      payload.data.generatedAt = new Date().toISOString();
    } else {
      const t = params.get("t");
      if (!t) throw new Error("нет токена");
      // токен запоминаем: кабинет по нему привязывает отчёт к аккаунту
      try { localStorage.setItem("scholary_report_token", t); } catch (e) {}
      const res = await fetch(C.SUPABASE_URL + "/rest/v1/rpc/get_report", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + C.SUPABASE_ANON_KEY },
        body: JSON.stringify({ p_token: t })
      });
      const j = await res.json();
      if (!j || !j.data) throw new Error("не найден");
      payload = j;
    }
  } catch (e) {
    /* Сюда попадает человек, который уже заплатил: ссылка старая, письмо
       потерялось, открыл не на том телефоне. Ему нужен не упрёк «проверь
       ссылку», а способ получить отчёт прямо сейчас. Форма ниже находит
       покупку по телефону или почте и отправляет ссылку на СОХРАНЁННЫЕ
       контакты — сам токен браузеру не выдаётся никогда. */
    renderRecovery(box, C);
    return;
  }

  /* Рендер под защитой: битый или очень старый снимок не должен оставлять
     оплатившего человека на вечном «Загружаем…» — показываем отчёт частично
     или честное сообщение с WhatsApp. */
  try {
  const d = payload.data, t = payload.texts || {};
  const axes = d.profile.axes;
  const name = esc(t.name || (d.answers && d.answers.name) || payload.demoName || "");
  const pAny = pct(d.pAtLeastOne);
  /* v3-поля (точка Б, окна, уверенность) есть только в новых отчётах.
     Старые сохранённые отчёты (engineVersion ≤ 2) обязаны рендериться
     как раньше — поэтому каждое v3-поле проверяем на существование. */
  const pDl = d.pAtLeastOneAtDeadline != null ? pct(d.pAtLeastOneAtDeadline) : null;
  const conf = d.confidence && d.confidence.low != null ? d.confidence : null;
  const plan = Array.isArray(d.plan) ? d.plan : [];
  const comments = {};
  (t.programs || []).forEach(p => { comments[p.id] = p.comment; });

  const axisRows = [["Академика", axes.academics], ["Язык", axes.language], ["Достижения", axes.achievements], ["Мотивационное", axes.motivation], ["Бюджет", axes.budget], ["Соответствие", axes.fit]]
    .map(([n, v]) => '<div class="bar-row"><span class="bar-label" style="width:118px">' + n + '</span><div class="bar' + (v < 5.5 ? " warn" : "") + '"><i style="width:' + (v * 10) + '%"></i></div><span class="bar-val">' + v.toFixed(1) + "</span></div>").join("");

  const tableRows = d.portfolio.map(p =>
    "<tr><td style='padding:9px 12px; font-weight:700'>" + esc(p.name) + "<span style='color:var(--muted); font-weight:600'> · " + esc(p.country) + "</span></td>" +
    "<td style='padding:9px 6px; text-align:right; font-weight:800; color:" + (p.p.adm >= .5 ? "var(--green)" : "var(--yellow)") + "'>" + pct(p.p.adm) + "%</td>" +
    "<td style='padding:9px 6px; text-align:right; font-weight:800; color:" + (p.p.sch == null ? "var(--muted)" : p.p.sch >= .45 ? "var(--green)" : "var(--yellow)") + "'>" + (p.p.sch == null ? "0 ₸*" : pct(p.p.sch) + "%") + "</td>" +
    "<td style='padding:9px 12px; text-align:right; font-weight:700; white-space:nowrap'>" + esc(p.deadline) + "</td></tr>").join("");

  const cards = d.portfolio.slice(0, 5).map(p =>
    '<div class="card" style="display:flex; flex-direction:column; gap:10px; padding:16px">' +
      '<div style="display:flex; justify-content:space-between; gap:8px; align-items:flex-start">' +
        '<div><strong style="font-size:14.5px">' + esc(p.name) + '</strong><div style="font-size:12px; color:var(--muted); font-weight:600">' + esc(p.country) + " · " + esc(p.funding || "") + "</div></div>" +
        '<span style="background:' + (p.tier === "anchor" ? "var(--green-soft); color:var(--green)" : "var(--accent-soft); color:var(--accent)") + '; font-size:11px; font-weight:800; border-radius:999px; padding:4px 9px; white-space:nowrap">' + (p.tier === "anchor" ? "якорная" : "амбициозная") + "</span></div>" +
      '<div class="bar-row"><span class="bar-label">Поступление</span><div class="bar' + (p.p.adm < .5 ? " warn" : "") + '"><i style="width:' + pct(p.p.adm) + '%"></i></div><span class="bar-val ' + (p.p.adm >= .5 ? "ok" : "warn") + '">' + pct(p.p.adm) + "%</span></div>" +
      (p.p.sch != null ? '<div class="bar-row"><span class="bar-label">Стипендия</span><div class="bar' + (p.p.sch < .45 ? " warn" : "") + '"><i style="width:' + pct(p.p.sch) + '%"></i></div><span class="bar-val ' + (p.p.sch >= .45 ? "ok" : "warn") + '">' + pct(p.p.sch) + "%</span></div>"
        : '<div style="font-size:12px; font-weight:700; color:var(--muted)">Стипендии нет — но обучение бесплатное</div>') +
      (p.p.admAtDeadline != null && pct(p.p.admAtDeadline) > pct(p.p.adm) && p.window && p.window.feasible !== false
        ? '<div style="font-size:12px; font-weight:700; color:var(--green)">к окну подачи — до ' + pct(p.p.admAtDeadline) + "%, если готовиться по плану</div>" : "") +
      /* v3: у программы есть просчитанное окно цикла — показываем дату с годом
         и остаток недель. Иначе (старый отчёт) — прежняя строка «обычно…»:
         «дедлайн: 22 июля» без года читается как «уже прошёл». */
      (p.window && p.window.known
        ? '<div class="notice"' + (p.window.feasible === false ? ' style="background:#FDECEC; color:#B42318"' : '') + '>окно подачи — до ' + esc(p.window.human) +
          (p.window.weeksLeft != null ? " · осталось " + p.window.weeksLeft + " нед" : "") +
          (p.window.note ? "<br>" + esc(p.window.note) : (p.note ? " · " + esc(p.note) : "")) + "</div>"
        : '<div class="notice">дедлайн — обычно ' + esc(p.deadline) + (p.note ? " · " + esc(p.note) : "") + "</div>") +
      (comments[p.id] ? '<div style="font-size:12.5px; color:var(--ink-soft); font-weight:600; line-height:1.5">' + esc(comments[p.id]) + "</div>" : "") +
    "</div>").join("");

  const boosters = d.boosters.map(b =>
    '<div style="display:flex; justify-content:space-between; gap:10px; align-items:center; background:var(--bg); border-radius:12px; padding:12px 14px"><span style="font-size:13.5px; font-weight:700">' + esc(b.what) + '</span><span style="font-size:14px; font-weight:800; color:var(--green); white-space:nowrap">+' + b.pp + " п.п.</span></div>").join("");

  /* v3: «План до окон подачи» — что конкретно сделать, чтобы дойти до точки Б.
     У старых отчётов plan пуст — блока просто нет. */
  const planBlock = plan.length
    ? '<div class="card" style="display:flex; flex-direction:column; gap:10px"><div><strong style="font-size:17px">План до окон подачи</strong>' +
      (pDl != null && pDl > pAny ? '<div style="font-size:12.5px; color:var(--muted); font-weight:600">выполнишь — шанс вырастает с ' + pAny + "% до " + pDl + "%</div>" : "") + "</div>" +
      plan.map(g => '<div style="background:var(--bg); border-radius:12px; padding:12px 14px"><div style="font-size:13.5px; font-weight:700">' + esc(g.what) + '</div>' +
        (g.detail ? '<div style="font-size:12px; color:var(--muted); font-weight:600; margin-top:2px">' + esc(g.detail) + "</div>" : "") + "</div>").join("") +
      "</div>"
    : "";

  /* v3: «Ближайшие окна подачи» — топ-3 реальных дедлайна портфеля. */
  const windows = d.portfolio
    .filter(p => p.window && p.window.known && p.window.weeksLeft != null)
    .sort((x, y) => (x.window.date < y.window.date ? -1 : 1)).slice(0, 3);
  const windowsBlock = windows.length
    ? '<div class="card" style="display:flex; flex-direction:column; gap:8px"><div><strong style="font-size:17px">Ближайшие окна подачи</strong>' +
      '<div style="font-size:12.5px; color:var(--muted); font-weight:600">типовые даты цикла — точную для своего года проверь на сайте программы</div></div>' +
      windows.map(p => '<div style="display:flex; justify-content:space-between; gap:10px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--border)">' +
        '<span style="font-size:13px; font-weight:700">' + esc(p.name) + '</span>' +
        '<span style="font-size:12.5px; font-weight:800; white-space:nowrap; color:' + (p.window.weeksLeft <= 8 ? "var(--yellow-ink, #8a6d1a)" : "var(--ink)") + '">до ' + esc(p.window.human) + " · " + p.window.weeksLeft + " нед</span></div>").join("") +
      "</div>"
    : "";

  const wa = txt => "https://wa.me/" + C.WHATSAPP_NUMBER + "?text=" + encodeURIComponent(txt);
  const rub = n => Number(n).toLocaleString("ru-RU").replace(/\u00A0/g, "\u00A0") + "\u00A0\u20B8";
  const PRICE_CONSULT = C.PRICE_CONSULT || 15000;
  const PRICE_PACKAGE = C.PRICE_PACKAGE || 35000;

  // Исходные данные расчёта: отчёт персональный, и это видно (старые отчёты без answers не ломаем)
  let srcBlock = "";
  if (d.answers) {
    const L = {
      level: { bachelor: "Бакалавриат", master: "Магистратура", phd: "PhD / докторантура" },
      gpa: { "5.0-4.5": "5.0–4.5", "4.4-4.0": "4.4–4.0", "3.9-3.5": "3.9–3.5", "<3.5": "ниже 3.5", "3.67+": "3.67+", "3.33-3.66": "3.33–3.66", "3.0-3.32": "3.0–3.32", "<3.0": "ниже 3.0", unknown: "не знаю" },
      lang: { have: "IELTS/TOEFL сдан", soon: "сдаёт в ближайшие полгода", none: "без сертификата" },
      budget: { "0": "0 ₸ — только полная стипендия", "<1m": "до 1 млн ₸/год", "1-3m": "1–3 млн ₸/год", "3m+": "3+ млн ₸/год" },
      priority: { scholarship: "стипендия и минимум расходов", country: "конкретная страна", university: "сильный университет", major: "конкретная специальность" }
    };
    const a = d.answers, rows = [];
    const push = (k, v) => { if (v) rows.push('<div style="display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:7px 0; border-bottom:1px solid var(--border)"><span style="color:var(--muted); font-weight:600; flex-shrink:0">' + k + '</span><span style="font-weight:700; text-align:right">' + esc(v) + "</span></div>"); };
    push("Уровень", (L.level[a.level] || "") + (a.year && a.year !== "later" ? " · " + a.year : ""));
    push("Академика", L.gpa[a.gpa_band] || L.gpa[a.gpa_uni] || L.gpa[a.gpa_phd] || "");
    push("Английский", (L.lang[a.lang_status] || "") + (a.ielts_band && a.ielts_band !== "unknown" ? " · " + a.ielts_band : ""));
    push("Достижения", a.achievements && a.achievements.length && a.achievements[0] !== "none" ? a.achievements.length + " " + (a.achievements.length === 1 ? "пункт" : a.achievements.length < 5 ? "пункта" : "пунктов") : "");
    push("Бюджет семьи", L.budget[a.budget] || "");
    push("Приоритет", L.priority[a.priority] || "");
    if (rows.length) srcBlock =
      '<div class="card" style="display:flex; flex-direction:column; gap:2px">' +
        '<strong style="font-size:15px; margin-bottom:6px">Исходные данные расчёта</strong>' + rows.join("") +
        '<div style="font-size:11.5px; color:var(--faint); font-weight:600; margin-top:8px">Отчёт сгенерирован персонально по этим данным' + (d.generatedAt ? " · " + new Date(d.generatedAt).toLocaleString("ru-RU", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "") + ". Изменились вводные — пересчитай в личном кабинете.</div>" +
      "</div>";
  }

  box.innerHTML =
    // 1. Вердикт
    '<div style="display:flex; flex-direction:column; gap:12px; background:#1A1D27; border-radius:18px; padding:22px 20px; color:#fff">' +
      '<div style="display:flex; justify-content:space-between; align-items:center"><strong style="font-size:15px">Scholary</strong><span style="font-size:11.5px; color:#7C8290; font-weight:600">' + new Date(payload.created_at || Date.now()).toLocaleDateString("ru-RU") + "</span></div>" +
      (name ? '<div style="font-size:12.5px; font-weight:700; color:#9AA0AC; text-transform:uppercase; letter-spacing:.8px">Отчёт для ' + name + "</div>" : "") +
      '<div style="font-size:22px; line-height:1.3; font-weight:800">' + esc(t.verdict || d.verdict.t) + "</div>" +
      '<div style="font-size:13.5px; color:#C9CCD4">' + esc(t.point_b || d.verdict.s) + "</div>" +
    "</div>" +
    // 2. Главное число
    '<div class="card" style="display:flex; align-items:center; gap:18px">' +
      '<svg width="92" height="92" viewBox="0 0 42 42" style="flex-shrink:0"><circle cx="21" cy="21" r="16" fill="none" stroke="#EDEBE6" stroke-width="5"/><circle cx="21" cy="21" r="16" fill="none" stroke="' + (pAny >= 55 ? "#187E54" : "#D9A413") + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + (pAny * 1.005).toFixed(1) + ' 100.5" transform="rotate(-90 21 21)"/><text x="21" y="23" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1A1D27" font-family="Manrope, sans-serif">' + pAny + "%</text></svg>" +
      '<div><strong style="font-size:15px">шанс хотя бы одного оффера</strong><div style="font-size:12.5px; color:var(--muted); line-height:1.5">при подаче во все ' + d.portfolio.length + " программ портфеля. Сильная сторона — " + esc(d.strongest).toLowerCase() + ", подтянуть — " + esc(d.weakest).toLowerCase() + "</div>" +
      (pDl != null && pDl > pAny ? '<div style="margin-top:8px; display:inline-block; background:var(--green-soft); color:var(--green); font-size:12px; font-weight:800; border-radius:999px; padding:4px 10px">к окнам подачи — до ' + pDl + "%, если выполнить план ниже</div>" : "") +
      (conf ? '<div style="font-size:11.5px; color:var(--faint); font-weight:600; margin-top:6px">точность расчёта: ' + esc(conf.label) + " · интервал " + pct(conf.low) + "–" + pct(conf.high) + "%. Заполнишь профиль в кабинете — интервал сузится.</div>" : "") +
      "</div>" +
    "</div>" +
    // 3. Бустеры
    '<div class="card" style="display:flex; flex-direction:column; gap:10px"><strong style="font-size:17px">Что поднимет шансы сильнее всего</strong>' + boosters +
      (t.boosters_text ? '<p style="font-size:13px; color:var(--ink-soft)">' + esc(t.boosters_text) + "</p>" : "") + "</div>" +
    // 3б. v3: план до окон подачи (у старых отчётов пусто)
    planBlock +
    // 3в. v3: ближайшие окна подачи (у старых отчётов пусто)
    windowsBlock +
    // 4. Таблица портфеля
    '<div><strong style="font-size:17px">Твой портфель: ' + d.portfolio.length + ' программ</strong>' +
      '<div class="card" style="padding:0; overflow-x:auto; margin-top:10px"><table style="width:100%; border-collapse:collapse; font-size:12px; min-width:340px">' +
      '<tr style="color:var(--muted); font-weight:700; text-align:left"><th style="padding:10px 12px; border-bottom:1px solid var(--border)">Программа</th><th style="padding:10px 6px; border-bottom:1px solid var(--border); text-align:right">Поступл.</th><th style="padding:10px 6px; border-bottom:1px solid var(--border); text-align:right">Стипенд.</th><th style="padding:10px 12px; border-bottom:1px solid var(--border); text-align:right">Дедлайн</th></tr>' +
      tableRows + "</table></div>" +
      '<div style="font-size:11px; color:var(--faint); font-weight:600; margin-top:6px">* 0 ₸ — стипендии нет, но обучение бесплатное. Даты дедлайнов — типовые для цикла: год к году они сдвигаются на несколько дней, точную дату для твоего года смотри на официальном сайте программы.</div></div>' +
    // 5. Карточки топ-5
    '<div style="display:flex; flex-direction:column; gap:10px">' + cards + "</div>" +
    // 6. Оси
    '<div class="card" style="display:flex; flex-direction:column; gap:10px"><div><strong style="font-size:17px">Профиль по шести осям</strong><div style="font-size:12.5px; color:var(--muted); font-weight:600">0–10 · для тех, кто хочет глубже — и для родителей</div></div>' + axisRows + "</div>" +
    // 6б. Исходные данные — доказательство персональности
    srcBlock +
    // 7. Следующий шаг
    '<div class="card" style="display:flex; flex-direction:column; gap:12px; background:var(--accent-soft); border-color:var(--accent-border)">' +
      '<strong style="font-size:17px">Что дальше</strong>' +
      '<p style="font-size:13.5px; color:#4B5060">' + esc(t.next_step || "Дальше самое сложное — документы. Большинство отказов случается по формальностям, а не по способностям: просроченный сертификат, не тот перевод, пропущенный второй трек.") + "</p>" +
      /* Цены берём из config.js, а не пишем руками: на этой кнопке уже была
         рассинхронизация — подпись «25 000 ₸» при сообщении на 35 000 ₸.
         Человек видел одну цену, а в WhatsApp уходила другая. */
      '<a class="btn btn-primary" href="' + wa("Здравствуйте! Получил(а) отчёт, хочу разбор со специалистом за " + rub(PRICE_CONSULT)) + '">Разбор со специалистом — ' + rub(PRICE_CONSULT) + '</a>' +
      '<a class="btn btn-outline" style="background:#fff" href="' + wa("Здравствуйте! Получил(а) отчёт, хочу пакет «Документы и подача» за " + rub(PRICE_PACKAGE)) + '">Документы и подача — ' + rub(PRICE_PACKAGE) + '</a>' +
    "</div>" +
    '<div class="fineprint">Scholary · scholary.kz · Оценка модели не является гарантией поступления</div>';

  track("report_open", { demo: params.get("demo") === "1" });
  } catch (err) {
    try { if (window.Sentry) Sentry.captureException(err); } catch (e) {}
    box.innerHTML =
      '<div class="card" style="display:flex; flex-direction:column; gap:12px">' +
        '<strong style="font-size:17px">Отчёт есть, но страница не смогла его показать</strong>' +
        '<p style="color:var(--muted); font-size:14px; margin:0">Такое бывает с очень старыми отчётами. Ничего не потеряно — напиши нам, пришлём отчёт в удобном виде за несколько минут.</p>' +
        '<a class="btn btn-primary" href="https://wa.me/' + C.WHATSAPP_NUMBER + '?text=' + encodeURIComponent("Здравствуйте! Не открывается отчёт по ссылке " + location.href.split("?")[0]) + '" target="_blank" rel="noopener">Написать в WhatsApp</a>' +
      "</div>";
    if (window.track) track("report_render_error");
  }
});
</script>
