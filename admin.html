<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Scholary — панель управления</title>
  <link rel="stylesheet" href="/css/style.css?v=53">
  <style>
    body { background: #F5F5F7; }
    .aw { max-width: 1180px; margin: 0 auto; padding: 20px 18px 90px; }
    .atop { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .atop h1 { font-size: clamp(21px, 3.4vw, 28px); margin: 0; letter-spacing: -0.02em; }
    .arow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-adm { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; background: #5B4BFF; color: #fff;
      border: none; border-radius: 999px; padding: 9px 18px; font-size: 14.5px; font-weight: 650; cursor: pointer; }
    .btn-adm:disabled { opacity: .5; cursor: default; }
    .btn-ghost { background: #fff; color: #1D1D1F; border: 1px solid #E0E0E6; }
    .seg { display: inline-flex; background: #E9E9EE; border-radius: 999px; padding: 3px; }
    .seg button { border: none; background: transparent; border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 650; color: #55555D; cursor: pointer; }
    .seg button.on { background: #fff; color: #1D1D1F; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 6px 0 18px; padding-bottom: 4px; }
    .tabs button { flex: 0 0 auto; border: 1px solid #E0E0E6; background: #fff; border-radius: 999px; padding: 8px 15px;
      font-size: 14px; font-weight: 650; color: #55555D; cursor: pointer; white-space: nowrap; }
    .tabs button.on { background: #1D1D1F; color: #fff; border-color: #1D1D1F; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .kpi { background: #fff; border: 1px solid #E8E8ED; border-radius: 16px; padding: 14px 15px; }
    .kpi .n { font-size: 26px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.15; }
    .kpi .l { color: #6E6E73; font-size: 12.5px; margin-top: 3px; }
    .kpi .s { color: #8A8A90; font-size: 11.5px; margin-top: 5px; }
    .kpi.hl { background: #1D1D1F; color: #fff; border-color: #1D1D1F; }
    .kpi.hl .l, .kpi.hl .s { color: rgba(255,255,255,.62); }
    .box { background: #fff; border: 1px solid #E8E8ED; border-radius: 18px; padding: 18px; margin-bottom: 16px; }
    .box h2 { font-size: 17.5px; margin: 0 0 4px; letter-spacing: -0.01em; }
    .box .sub { color: #6E6E73; font-size: 13px; margin: 0 0 14px; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
    .frow { display: grid; grid-template-columns: minmax(120px, 190px) 1fr 96px; gap: 10px; align-items: center; margin: 9px 0; font-size: 14px; }
    .fbar { height: 22px; border-radius: 8px; background: #F2F2F5; overflow: hidden; }
    .fbar i { display: block; height: 100%; background: #5B4BFF; border-radius: 8px; min-width: 2px; }
    .fnum { text-align: right; font-variant-numeric: tabular-nums; }
    .fnum small { color: #6E6E73; margin-left: 4px; }
    .scroll { overflow-x: auto; }
    table.adm { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    table.adm th { text-align: left; color: #6E6E73; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid #E8E8ED; white-space: nowrap; }
    table.adm td { padding: 9px 10px; border-bottom: 1px solid #F0F0F4; vertical-align: top; }
    table.adm tr:last-child td { border-bottom: none; }
    table.adm td.num, table.adm th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; }
    .pill.ok { background: #E7F8EE; color: #0B7A3E; }
    .pill.no { background: #F2F2F5; color: #55555D; }
    .pill.warn { background: #FFF3E0; color: #8A5000; }
    .pill.bad { background: #FDECEA; color: #A32C1E; }
    .keybox { max-width: 440px; margin: 12vh auto 0; background: #fff; border: 1px solid #E8E8ED; border-radius: 22px; padding: 26px; }
    .keybox h1 { font-size: 23px; margin: 0 0 8px; }
    .keybox p { color: #6E6E73; font-size: 14px; line-height: 1.5; }
    .keybox input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #D2D2D7; border-radius: 12px; font-size: 16px; margin: 10px 0 12px; }
    .muted { color: #6E6E73; font-size: 13px; }
    .err { color: #A32C1E; font-size: 14px; margin-top: 8px; }
    .note { background: #F7F7FA; border: 1px solid #ECECF1; border-radius: 12px; padding: 11px 13px; font-size: 13px; color: #45454C; line-height: 1.5; margin-top: 12px; }
    .chart { width: 100%; height: 170px; display: block; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: #6E6E73; margin-top: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .tools input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #D2D2D7; border-radius: 10px; font-size: 16px; }
    @media (max-width: 560px) { .frow { grid-template-columns: 1fr 70px; } .frow .fbar { grid-column: 1 / -1; } }
  </style>
</head>
<body>

<div id="gate" class="keybox" hidden>
  <h1>Панель Scholary</h1>
  <p>Вход по обычной почте и паролю — тем же аккаунтом, что и в кабинете.
  Доступ открыт только тем, кто добавлен в список администраторов.</p>
  <input id="admEmail" type="email" autocomplete="username" placeholder="почта">
  <input id="admPass" type="password" autocomplete="current-password" placeholder="пароль">
  <button class="btn-adm" id="loginBtn">Войти</button>
  <div id="gateErr" class="err" hidden></div>
  <p class="muted" style="margin-top:14px">Забыл пароль — <a href="/cabinet/">восстанови его в кабинете</a>, панель использует тот же аккаунт.</p>
</div>

<div id="panel" class="aw" hidden>
  <div class="atop">
    <div>
      <h1>Панель Scholary</h1>
      <div class="muted" id="updatedAt"></div>
    </div>
    <div class="arow">
      <div class="seg" id="periodSeg">
        <button data-d="7">7 дней</button>
        <button data-d="30" class="on">30 дней</button>
        <button data-d="90">90 дней</button>
        <button data-d="365">Год</button>
      </div>
      <button class="btn-adm" id="btnReload">Обновить</button>
      <button class="btn-adm btn-ghost" id="btnReport">Скачать отчёт</button>
      <button class="btn-adm btn-ghost" id="btnLogout">Выйти</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-t="overview" class="on">Обзор</button>
    <button data-t="money">Деньги</button>
    <button data-t="funnel">Воронка</button>
    <button data-t="channels">Каналы</button>
    <button data-t="people">Люди</button>
    <button data-t="reports">Отчёты</button>
    <button data-t="product">Продукт</button>
    <button data-t="system">Система</button>
  </div>

  <div id="view"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script>
/* Если библиотека Supabase не загрузилась (блокировщик, корпоративный фильтр,
   сбой CDN) — раньше страница оставалась пустой и человек упирался в тупик.
   Пробуем запасной адрес, а если и он молчит — говорим об этом по-человечески. */
(function () {
  var FALLBACK = "https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
  function fail() {
    // Раньше здесь всегда ждали DOMContentLoaded. Но срабатывает эта функция
    // по таймауту через несколько секунд, когда событие давно прошло, —
    // и сообщение не показывалось никогда: человек видел белый экран.
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", render);
    else render();
    function render() {
      if (window.supabase && window.supabase.createClient) return;
      document.body.innerHTML =
        '<div style="max-width:520px;margin:14vh auto;padding:28px;font:15px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#1D1D1F;text-align:center">' +
        '<h1 style="font-size:22px;margin:0 0 10px">Не получилось загрузить панель</h1>' +
        '<p style="color:#6E6E73;margin:0 0 18px">Похоже, часть кода заблокирована — это бывает из-за блокировщика рекламы, VPN или сети оператора. ' +
        'Попробуй отключить блокировщик и обновить страницу или зайти из другого браузера.</p>' +
        '<p style="margin:0 0 18px"><a href="/" style="color:#5B4BFF;font-weight:650">Вернуться на главную</a></p>' +
        '<p style="margin:0"><a href="https://wa.me/' + ((window.SCHOLARY_CONFIG && window.SCHOLARY_CONFIG.WHATSAPP_NUMBER) || "77024666852") +
        '" style="display:inline-flex;align-items:center;min-height:44px;padding:0 22px;background:#0B7A3E;color:#fff;border-radius:999px;text-decoration:none;font-weight:700">Написать нам в WhatsApp</a></p></div>';
    }
  }
  if (window.supabase && window.supabase.createClient) return;
  var s = document.createElement("script");
  s.src = FALLBACK; s.async = false;
  s.onerror = fail;
  s.onload = function () { if (!(window.supabase && window.supabase.createClient)) fail(); };
  document.head.appendChild(s);
  setTimeout(fail, 6000);   // молчаливый таймаут: сеть может просто зависнуть
})();
</script>
<script src="/js/config.js?v=53"></script>
<!-- Движок вероятностей нужен админке, чтобы собрать отчёт задним числом
     по ответам анкеты: формулы одни и те же, что и в квизе. -->
<script src="/js/report-engine.js?v=53"></script>
<script src="/js/admin.js?v=53"></script>
<!-- Панель управления намеренно не попадает в Яндекс.Метрику: это внутренний
     инструмент, а Вебвизор записывал бы почты и имена абитуриентов. -->
</body>
</html>
